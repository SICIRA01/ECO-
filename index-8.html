const navdot=()=>{const b=document.querySelector('nav [data-t="circ"]');if(b)b.classList.toggle("un",!!Object.keys(UN).length)};
async function avisos(){const {data}=await sb.from("circles").select("id");(data||[]).forEach(c=>assin(c.id));await calcUN((data||[]).map(c=>c.id));navdot()}
function ir(t){sair();toast("");document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));({eco:meuEco,circ:home,perfil:perfil})[t]()}

/* ---------- gravador (usado no Meu Eco, círculos e respostas) ---------- */
function recorder(box,o){
box.innerHTML=`<div class="stage"><button class="rec">Gravar</button></div><p class="mute" style="text-align:center;margin:0 0 6px">Até ${o.max>=120?o.max/60+" minutos":o.max+" segundos"}</p><div style="text-align:center"><label class="link">📷 Adicionar imagem (opcional)<input type="file" accept="image/*"></label><small class="fn"></small></div>`;
const b=box.querySelector(".rec"),f=box.querySelector("input");
f.onchange=()=>{box.querySelector(".fn").textContent=f.files[0]?f.files[0].name:""};
b.onclick=()=>gravar(box,b,f,o)}

async function gravar(box,b,f,o){
if(!window.MediaRecorder)return toast("Este navegador não grava áudio.");
let s;try{s=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}})}catch(e){return toast("Sem acesso ao microfone.")}
const ch=[],r=new MediaRecorder(s,{audioBitsPerSecond:24000});let t=0,iv;
r.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
r.onstop=async()=>{
clearInterval(iv);s.getTracks().forEach(k=>k.stop());b.disabled=true;b.classList.remove("on");b.textContent="A guardar…";
const m=r.mimeType||"audio/webm",base=me.id+"/"+crypto.randomUUID(),ap=base+"."+(/mp4/.test(m)?"m4a":"webm"),fl=f.files[0],ip=fl?base+"-img."+ext(fl):null,bk=sb.storage.from("ecos");
const fail=async(msg,lst)=>{await rm(lst);toast(msg);recorder(box,o)};
const sv=async(k,blob,type)=>{try{const r=await sb.functions.invoke("smart-processor",{body:{op:"put",key:k}});if(!r.error&&r.data&&r.data.url){const x=await fetch(r.data.url,{method:"PUT",body:blob,headers:{"Content-Type":type}});if(x.ok)return "fb:"+k}}catch(e){}
const u=await bk.upload(k,blob,{contentType:type});return u.error?null:k};
const ap2=await sv(ap,new Blob(ch,{type:m}),m.split(";")[0]);if(!ap2)return fail("Não foi possível guardar o áudio.",[]);
let ip2=null;if(fl){ip2=await sv(ip,fl,fl.type);if(!ip2)return fail("Não foi possível guardar a imagem.",[ap2])}
const i=await sb.from("ecos").insert({circle_id:o.circle||null,user_id:me.id,path:ap2,image_path:ip2,duration:t,reply_to:o.reply||null,period:P(new Date().getHours()).p,day:hoje()});
if(i.error)return fail(i.error.message,[ap2,ip2]);
o.keep?recorder(box,o):box.innerHTML="";toast("Guardado.");ding();o.done()};
r.start();b.classList.add("on");b.textContent="Parar · 0:00";
b.onclick=()=>{if(r.state==="recording")r.stop()};
iv=setInterval(()=>{t++;b.textContent="Parar · "+mmss(t);if(t>=o.max)r.stop()},1000)}

/* ---------- lista de áudios (cartões individuais, respostas, reações) ---------- */
async function lista(box,L,circ,ctx){
await profs(L.map(e=>e.user_id));await urls(L.flatMap(e=>[e.path,e.image_path]));
const R={};if(L.length){const {data}=await sb.from("reactions").select("eco_id,user_id,emoji").in("eco_id",L.map(e=>e.id));(data||[]).forEach(x=>(R[x.eco_id]=R[x.eco_id]||[]).push(x));await profs((data||[]).map(x=>x.user_id))}
if(circ){ctx.P={};const mine=L.filter(e=>e.user_id===me.id).map(e=>e.id);
if(mine.length){const {data}=await sb.from("plays").select("eco_id,user_id,heard").in("eco_id",mine);(data||[]).forEach(x=>(ctx.P[x.eco_id]=ctx.P[x.eco_id]||[]).push(x));await profs((data||[]).map(x=>x.user_id))}
const vis=L.filter(e=>e.user_id!==me.id).map(e=>({eco_id:e.id,user_id:me.id}));
if(vis.length)sb.from("plays").upsert(vis,{onConflict:"eco_id,user_id",ignoreDuplicates:true}).then(()=>{})}
const kids={},by={};L.forEach(e=>{by[e.id]=e;if(e.reply_to)(kids[e.reply_to]=kids[e.reply_to]||[]).push(e)});
box.innerHTML="";
const put=(e,par)=>{const c=card(e,R[e.id]||[],circ,ctx,by);par.appendChild(c);(kids[e.id]||[]).forEach(k=>put(k,c.querySelector(".kids")))};
L.filter(e=>!e.reply_to||!by[e.reply_to]).forEach(e=>put(e,box));
if(!L.length)box.innerHTML='<p class="mute">Ainda não há gravações. Toca em Gravar para começar.</p>'}

function card(e,rx,circ,ctx,by){
const q=PAL.find(x=>x.p===e.period)||PAL[1],p=PR[e.user_id],d=document.createElement("div"),pa=e.reply_to&&by[e.reply_to],im=e.image_path&&U[e.image_path],mine=e.user_id===me.id,mr=rx.find(x=>x.user_id===me.id),foto=!!(e.duration===0&&e.image_path&&e.image_path===e.path);
d.className="ec"+(mine?" me":"");d.style.setProperty("--c",q.acc);d.style.setProperty("--on",q.on);
const bt=EM.map(m=>{const n=rx.filter(x=>x.emoji===m);return `<button class="rx${mr&&mr.emoji===m?" me":""}" data-m="${m}" aria-label="Reagir ${m}">${m}${n.length?"<b>"+n.length+"</b>":""}</button>`}).join("");
const who=EM.map(m=>{const n=rx.filter(x=>x.emoji===m);return n.length?m+" "+n.map(x=>esc(nm(PR[x.user_id]))).join(", "):""}).filter(Boolean).join("  ·  ");
const pent=e.user_id===ctx.owner?'<i class="pent" title="Criador do círculo">⬟</i>':"";
d.innerHTML=`<div class="bb"><div class="hd">${mine?"":av(p)+"<b>"+esc(nm(p))+"</b>"}${pent}<small>${fmt(e.created_at)}</small></div>${pa?`<small>↳ ${esc(nm(PR[pa.user_id]))}</small>`:""}${foto?`<div class="ph"><img src="${esc(U[e.path]||"")}" alt="Foto"></div>`:`<div class="pl"><audio controls preload="none" src="${esc(U[e.path]||"")}"></audio><img class="th" src="${im?esc(im):"logo.png"}" alt=""></div>`}<div class="rxs">${bt}</div>${who?`<small>${who}</small>`:""}<div class="act">${circ?'<button class="link" data-a="r">Responder</button>':""}${mine?'<button class="link" data-a="d">Apagar</button>':""}${circ&&mine?'<button class="star" data-a="s" hidden aria-label="Quem viu">★</button>':""}</div><div class="vw" hidden></div></div><div class="rb"></div><div class="kids"></div>`;
d.querySelectorAll(".rx").forEach(b=>b.onclick=async()=>{const m=b.dataset.m;
const r=mr&&mr.emoji===m?await sb.from("reactions").delete().match({eco_id:e.id,user_id:me.id}):await sb.from("reactions").upsert({eco_id:e.id,user_id:me.id,emoji:m},{onConflict:"eco_id,user_id"});
r.error?toast(r.error.message):ctx.reload()});
const dl=d.querySelector('[data-a="d"]');if(dl)dl.onclick=async()=>{if(!confirm("Apagar esta gravação?"))return;
const ex=[e.path,e.image_path];let ids=[e.id];while(ids.length){const {data}=await sb.from("ecos").select("id,path,image_path").in("reply_to",ids);ids=(data||[]).map(x=>{ex.push(x.path,x.image_path);return x.id})}
const r=await sb.from("ecos").delete().eq("id",e.id);if(r.error)return toast(r.error.message);
await rm(ex);ctx.reload()};
const rp=d.querySelector('[data-a="r"]');if(rp)rp.onclick=()=>{const b=d.querySelector(".rb");b.innerHTML?b.innerHTML="":recorder(b,{max:90,circle:ctx.cid,reply:e.id,done:ctx.novo||ctx.reload})};
const st=d.querySelector('[data-a="s"]');if(st){const pl=(ctx.P&&ctx.P[e.id])||[];if(pl.length){st.hidden=false;st.onclick=()=>{const v=d.querySelector(".vw"),ou=pl.filter(x=>x.heard),n=a=>a.map(x=>esc(nm(PR[x.user_id]))).join(", ");v.hidden=!v.hidden;v.innerHTML=`Viram ${pl.length}: ${n(pl)}`+(foto?"":`<br>Ouviram ${ou.length}: ${ou.length?n(ou):"ninguém ainda"}`)}}}
const ph=d.querySelector(".ph img");if(ph)ph.onclick=()=>{const l=document.createElement("div");l.className="lb";l.innerHTML=`<img src="${esc(U[e.path]||"")}" alt="">`;l.onclick=()=>l.remove();document.body.appendChild(l)};
const au=d.querySelector("audio");if(au&&circ&&!mine)au.addEventListener("play",()=>sb.from("plays").upsert({eco_id:e.id,user_id:me.id,heard:true},{onConflict:"eco_id,user_id"}).then(()=>{}),{once:true});
return d}

/* ---------- fotos nos círculos ---------- */
function peq(f,max=1280,q=.72){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const e=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*e);c.height=Math.round(im.height*e);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),"image/jpeg",q)};im.onerror=no;im.src=u})}
async function svk(k,blob,type){try{const r=await sb.functions.invoke("smart-processor",{body:{op:"put",key:k}});if(!r.error&&r.data&&r.data.url){const x=await fetch(r.data.url,{method:"PUT",body:blob,headers:{"Content-Type":type}});if(x.ok)return "fb:"+k}}catch(e){}
const u=await sb.storage.from("ecos").upload(k,blob,{contentType:type});return u.error?null:k}
async function enviaFoto(f,cid,done){toast("A enviar a foto…");
try{const b=await peq(f),k=me.id+"/"+crypto.randomUUID()+"-foto.jpg",p=await svk(k,b,"image/jpeg");if(!p)return toast("Não foi possível guardar a foto.");
const i=await sb.from("ecos").insert({circle_id:cid,user_id:me.id,path:p,image_path:p,duration:0,period:P(new Date().getHours()).p,day:hoje()});
if(i.error){await rm([p]);return toast(i.error.message)}
toast("Foto enviada.");ding();done()}catch(e){toast("Erro ao enviar a foto.")}}

async function meuEco(){
V().innerHTML=`<div class="top"><img class="logoimg" src="logo.png" alt="Eco"><h1>meu eco</h1></div><p class="sub">O teu diário em voz. Só tu o ouves.</p><div id="rc"></div><h2>O teu arquivo</h2><div id="ls"></div>`;

async function home(){sair();
if(pending){const r=await sb.rpc("join_circle",{p_code:pending});pending=null;history.replaceState(null,"",location.pathname);toast(r.error?r.error.message:"Entraste no círculo.")}
const {data}=await sb.from("circles").select("id,name,invite_code,owner").order("created_at");await calcUN((data||[]).map(c=>c.id));navdot();
V().innerHTML=`<div class="top"><img class="logoimg" src="logo.png" alt="Eco"><h1>círculos</h1></div><p class="sub">Conversas privadas, até 50 pessoas.</p><div id="cl"></div><div class="card"><input id="cn" placeholder="nome do novo círculo" maxlength="40"><button class="big" id="cc">Criar círculo</button></div><div class="card"><input id="cj" placeholder="código de convite"><button class="ghost" id="cb">Entrar com código</button></div>`;
(data||[]).forEach(c=>assin(c.id));
(data||[]).forEach((c,i)=>{const q=PAL[i%4],b=document.createElement("button");b.className="item";b.style.setProperty("--c",q.acc);b.style.setProperty("--t",q.on);b.dataset.id=c.id;b.innerHTML='<span></span><span class="r">'+(UN[c.id]?'<i class="dot"></i>':"")+'<em>›</em></span>';b.firstChild.textContent=c.name;b.onclick=()=>circle(c);$("#cl").appendChild(b)});
if(!(data||[]).length)$("#cl").innerHTML='<p class="mute">Ainda não tens círculos. Cria um e convida amigos.</p>';
$("#cc").onclick=async()=>{const n=$("#cn").value.trim();if(!n)return;const r=await sb.rpc("create_circle",{p_name:n});r.error?toast(r.error.message):circle(r.data)};
$("#cb").onclick=async()=>{const r=await sb.rpc("join_circle",{p_code:$("#cj").value});r.error?toast(r.error.message):home()}}

async function circle(c){
toast("");delete UN[c.id];navdot();const own=c.owner||me.id,link=location.origin+location.pathname+"#entrar="+c.invite_code;
V().innerHTML=`<div class="top"><button class="link" id="bk">←</button><h1>${esc(c.name)}</h1></div><div id="mb"></div><details class="card"><summary>Convidar pessoas</summary><small>Código: ${esc(c.invite_code)}</small><input id="lk" readonly value="${esc(link)}"><button class="ghost" id="sh">Partilhar convite</button></details><div id="ls"></div><button class="big" id="nv">🎙 Nova mensagem</button><label class="ghost" style="display:block;text-align:center;margin-bottom:6px;cursor:pointer">📷 Enviar foto<input id="fo" type="file" accept="image/*"></label><div id="rc"></div>`;
$("#bk").onclick=home;
$("#sh").onclick=()=>navigator.share?navigator.share({title:"Eco",text:"Entra no meu círculo no Eco:",url:link}).catch(()=>{}):(navigator.clipboard.writeText(link),toast("Link copiado."));
const fim=()=>scrollTo(0,document.body.scrollHeight);
const ctx={cid:c.id,owner:own,reload:async()=>{const {data}=await sb.from("ecos").select("*").eq("circle_id",c.id).order("created_at").limit(300);await lista($("#ls"),data||[],true,ctx)}};
ctx.novo=async()=>{await ctx.reload();fim();assin(c.id);NT[c.id].send({type:"broadcast",event:"novo",payload:{n:nm(pr),c:c.name}})};
$("#nv").onclick=()=>{const r=$("#rc");r.innerHTML?r.innerHTML="":recorder(r,{max:90,circle:c.id,done:ctx.novo})};
$("#fo").onchange=async()=>{const f=$("#fo").files[0];if(!f)return;await enviaFoto(f,c.id,ctx.novo);$("#fo").value=""};
let m=[],on={};
const paint=()=>{$("#mb").innerHTML=`<small>${m.length} de 50 membros · ${Object.keys(on).length} online</small><div class="avr">`+m.map(x=>{const p=PR[x.user_id],o=x.user_id===own;return `<span class="mbr${on[x.user_id]?" on":""}">${av(p)}${own===me.id&&!o?`<button class="x" data-u="${x.user_id}" aria-label="Remover">×</button>`:""}<small>${o?'<i class="pent">⬟</i> ':""}${esc(nm(p))}</small></span>`}).join("")+"</div>";
document.querySelectorAll("#mb .x").forEach(b=>b.onclick=async()=>{if(!confirm("Remover este membro do círculo?"))return;const r=await sb.from("members").delete().eq("circle_id",c.id).eq("user_id",b.dataset.u).select();if(r.error)return toast(r.error.message);if(!r.data||!r.data.length)return toast("Não foi possível remover. Corre o SQL novo no Supabase.");m=m.filter(x=>x.user_id!==b.dataset.u);paint();toast("Membro removido.")})};
m=(await sb.from("members").select("user_id").eq("circle_id",c.id)).data||[];await profs(m.map(x=>x.user_id));paint();
sair();cur=ctx;assin(c.id);ch=sb.channel("circ-"+c.id,{config:{presence:{key:me.id}}});
ch.on("presence",{event:"sync"},()=>{on=ch.presenceState();paint()})
.subscribe(async st=>{if(st==="SUBSCRIBED")await ch.track({t:Date.now()})});
